<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>キャラ別装備管理 | トリッカル装備周回メモ</title>
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="./page.css">
</head>
<body class="character-manager-page">
  <header class="app-header">
    <div>
      <h1>キャラ別装備管理</h1>
      <p>キャラごとの現在Rankと、装着済みの6箇所を記録します。</p>
    </div>
    <div class="header-actions">
      <a href="../">探索ネットワークへ戻る</a>
      <a href="../../">通常ページへ戻る</a>
    </div>
  </header>
  <main class="character-layout">
    <section class="character-browser">
      <div class="character-browser-head">
        <h2>使徒一覧</h2>
        <span id="characterCounter"></span>
      </div>
      <div class="character-filters">
        <input id="characterSearch" type="search" autocomplete="off" placeholder="キャラ名を検索" aria-label="キャラ名を検索">
        <label class="character-filter-toggle">
          <input id="trackedOnly" type="checkbox">
          登録済みのみ表示
        </label>
      </div>
      <div id="characterList" class="character-list"></div>
    </section>
    <section class="character-editor" aria-label="選択したキャラの装備">
      <div class="character-editor-head">
        <div>
          <h2 id="characterName">キャラを選択</h2>
          <p id="characterStatus">装備情報を読み込んでいます。</p>
        </div>
        <button id="registrationButton" type="button" class="ghost-button" disabled>登録する</button>
      </div>
      <div class="character-rank-controls">
        <label for="characterRank">現在Rank
          <select id="characterRank" disabled></select>
        </label>
        <div id="characterProgress" class="character-progress">装着済み 0 / 6</div>
      </div>
      <div id="characterGear" class="character-gear"></div>
      <div class="character-editor-actions">
        <button id="rankUpButton" type="button" disabled>次のRankへ</button>
        <a id="characterSource" href="https://soshage.com/trickcal/unit" target="_blank" rel="noopener noreferrer">装備データの出典を見る</a>
      </div>
      <p class="character-storage-note">変更はこのブラウザに自動保存されます。設計図の所持数や完成済み装備の在庫は、この画面では消費しません。</p>
    </section>
  </main>
  <script src="./page.js"></script>
</body>
</html>
