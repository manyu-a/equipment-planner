<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>キャラ別装備管理 | トリッカル装備周回メモ</title>
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="./page.css">
</head>
<body class="character-manager-page">
  <header class="app-header">
    <div>
      <h1>キャラ別装備管理</h1>
      <p>装備アイコンを選択して、キャラごとの装着状況を記録します。</p>
    </div>
    <div class="header-actions">
      <a href="../">探索ネットワークへ戻る</a>
      <a href="../../">通常ページへ戻る</a>
    </div>
  </header>
  <main class="character-layout">
    <div class="character-toolbar">
      <label class="character-search">
        <span>使徒検索</span>
        <input id="characterSearch" type="search" autocomplete="off" placeholder="キャラ名を入力">
      </label>
      <label class="character-filter">
        <input id="trackedOnly" type="checkbox">
        登録済みのみ
      </label>
      <span id="characterCounter" class="character-counter"></span>
    </div>
    <p class="character-legend">装備画像をクリックして装着状態を変更します。薄い画像は装着済みです。Rank変更・装着状況は自動保存されます。</p>
    <div class="character-roster-scroll">
      <div class="character-roster-head" aria-hidden="true">
        <span>使徒</span>
        <span>現在Rank</span>
        <span>装備（6枠）</span>
        <span>装着</span>
        <span>管理</span>
      </div>
      <div id="characterList" class="character-list"></div>
    </div>
    <p class="character-note">
      装備名称とRank情報：<a href="https://soshage.com/trickcal/unit" target="_blank" rel="noopener noreferrer">soshage</a>。
      装備画像・日本語名：<a href="https://wikiwiki.jp/thetrickal/装備ランク別等級表#rank10" target="_blank" rel="noopener noreferrer">トリッカルWiki</a>。
      設計図や完成済み装備の在庫は、この画面では消費しません。
    </p>
  </main>
  <script src="./page.js"></script>
</body>
</html>
